<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>ImageForge Web · 图片格式转换与多尺寸 ICO</title>
  <meta name="description" content="免安装的浏览器端图片格式转换工具：JPG / PNG / WebP / BMP / TIFF / AVIF 互转，多尺寸 ICO 生成，全部在本地完成。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232B63D9'/%3E%3Cpath d='M20 24a8 8 0 1 1 8-8' fill='none' stroke='white' stroke-width='5' stroke-linecap='round'/%3E%3Cpath d='M44 40a8 8 0 1 1-8 8' fill='none' stroke='white' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-arrows" viewBox="0 0 24 24">
      <path d="M4 9a6 6 0 0 1 6-6h2" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
      <path d="M9.5 1.6 12.4 4 9.5 6.4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M20 15a6 6 0 0 1-6 6h-2" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
      <path d="M14.5 17.6 11.6 20l2.9 2.4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-folder" viewBox="0 0 24 24">
      <path d="M3.5 7.5A2 2 0 0 1 5.5 5.5h4l1.8 2h6.2a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-plus" viewBox="0 0 24 24">
      <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-paste" viewBox="0 0 24 24">
      <path d="M9 4.5h6a1.5 1.5 0 0 1 1.5 1.5v1H7.5V6A1.5 1.5 0 0 1 9 4.5z" fill="none" stroke="currentColor" stroke-width="1.7"/>
      <path d="M6.5 7.5h11a1.5 1.5 0 0 1 1.5 1.5v9.5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 5 18.5V9a1.5 1.5 0 0 1 1.5-1.5z" fill="none" stroke="currentColor" stroke-width="1.7"/>
    </symbol>
    <symbol id="i-trash" viewBox="0 0 24 24">
      <path d="M5 7h14M9.5 7V5h5v2M7 7l.8 12h8.4L17 7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-sun" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <path d="M12 2.8v2.1M12 19.1v2.1M2.8 12h2.1M19.1 12h2.1M5.5 5.5l1.5 1.5M17 17l1.5 1.5M18.5 5.5 17 7M7 17l-1.5 1.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-moon" viewBox="0 0 24 24">
      <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" fill="currentColor"/>
    </symbol>
    <symbol id="i-image" viewBox="0 0 24 24">
      <rect x="3.5" y="4.5" width="17" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/>
      <circle cx="9" cy="10" r="1.6" fill="currentColor"/>
      <path d="m4.8 17 4.4-4.3 3 2.9 2.7-2.6 3.6 3.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-close" viewBox="0 0 24 24">
      <path d="m6 6 12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-external" viewBox="0 0 24 24">
      <path d="M14 4h6v6M20 4l-8.5 8.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M18 14v4.5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 4 18.5v-11A1.5 1.5 0 0 1 5.5 6H10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </symbol>
  </svg>

  <div class="app">
    <header class="app-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><svg width="22" height="22"><use href="#i-arrows"/></svg></span>
        <div class="brand-text">
          <h1>ImageForge <span class="version">Web</span></h1>
          <p>图片格式转换 · 多尺寸 ICO · 免安装</p>
        </div>
      </div>
      <div class="header-actions">
        <button id="theme-toggle" class="icon-button" type="button" aria-label="切换深浅色主题" title="切换深浅色主题">
          <svg class="icon-sun" width="18" height="18"><use href="#i-sun"/></svg>
          <svg class="icon-moon" width="18" height="18"><use href="#i-moon"/></svg>
        </button>
      </div>
    </header>

    <main class="layout">
      <section class="panel queue-panel" aria-labelledby="queue-title">
        <div class="panel-head">
          <h2 id="queue-title">待处理 <span id="queue-count" class="counter">0</span></h2>
          <div class="toolbar" role="group" aria-label="添加图片">
            <button id="add-files" class="btn btn-primary" type="button">
              <svg width="16" height="16" aria-hidden="true"><use href="#i-plus"/></svg>
              添加图片
            </button>
            <button id="add-folder" class="btn" type="button">
              <svg width="16" height="16" aria-hidden="true"><use href="#i-folder"/></svg>
              文件夹
            </button>
            <button id="paste" class="btn btn-ghost" type="button" title="Ctrl+V">
              <svg width="16" height="16" aria-hidden="true"><use href="#i-paste"/></svg>
              粘贴
            </button>
            <button id="clear" class="btn btn-ghost" type="button" disabled>
              <svg width="16" height="16" aria-hidden="true"><use href="#i-trash"/></svg>
              清空
            </button>
          </div>
        </div>

        <div id="drop-zone" class="drop-zone" tabindex="0" role="button" aria-label="拖入或用键盘添加图片">
          <span class="drop-icon" aria-hidden="true"><svg width="30" height="30"><use href="#i-image"/></svg></span>
          <p class="drop-title">把图片或文件夹拖到这里</p>
          <p class="drop-sub">支持 PNG · JPG · WebP · BMP · TIFF · AVIF · ICO · GIF</p>
          <p class="drop-hint">也可以按 <kbd>Ctrl</kbd> + <kbd>O</kbd> 选择文件，或直接 <kbd>Ctrl</kbd> + <kbd>V</kbd> 粘贴</p>
        </div>

        <ul id="queue" class="queue" hidden aria-live="polite"></ul>
      </section>

      <aside class="panel settings-panel" aria-labelledby="settings-title">
        <div class="panel-head">
          <h2 id="settings-title">输出设置</h2>
          <span id="support-note" class="hint"></span>
        </div>
        <div class="settings-body">
          <fieldset class="group">
            <legend>输出格式</legend>
            <div id="format-grid" class="chips chips-format" role="radiogroup" aria-label="输出格式"></div>
            <p id="format-note" class="note"></p>
          </fieldset>

          <div id="quality-group" class="group" hidden>
            <div class="row-label">
              <label for="quality">质量</label>
              <output id="quality-value" for="quality">92</output>
            </div>
            <input id="quality" class="range" type="range" min="1" max="100" step="1" value="92">
          </div>

          <fieldset id="ico-group" class="group">
            <legend>图标尺寸</legend>
            <div id="size-grid" class="checks" role="group" aria-label="图标尺寸"></div>
            <div class="inline-row">
              <span class="inline-label">非正方形</span>
              <div id="fit-grid" class="chips chips-sm" role="radiogroup" aria-label="非正方形处理方式"></div>
            </div>
            <div class="inline-row">
              <span class="inline-label">像素数据</span>
              <div id="payload-grid" class="chips chips-sm" role="radiogroup" aria-label="像素数据格式"></div>
            </div>
          </fieldset>

          <div id="bg-group" class="group" hidden>
            <div class="row-label">
              <label for="bg-color">背景色</label>
              <span class="hint">透明区域会被填充</span>
            </div>
            <input id="bg-color" class="color-input" type="color" value="#ffffff" aria-label="背景色">
          </div>

          <fieldset class="group">
            <legend>其它</legend>
            <label class="check-row" id="lossless-row">
              <input id="lossless" type="checkbox">
              <span>WebP 无损</span>
            </label>
            <div class="row-label">
              <label for="suffix">文件名后缀</label>
              <span class="hint">可选</span>
            </div>
            <input id="suffix" class="text-input" type="text" placeholder="例如 _hd" maxlength="40" autocomplete="off">
            <p id="name-preview" class="note mono" aria-live="polite"></p>
          </fieldset>
        </div>
      </aside>
    </main>

    <footer class="app-footer">
      <div class="progress" role="progressbar" aria-labelledby="status" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="progress-bar" class="progress-fill"></div>
      </div>
      <div class="footer-row">
        <p id="status" class="status" aria-live="polite">拖入图片，或按 Ctrl+O 添加</p>
        <div class="footer-actions">
          <button id="download-all" class="btn btn-ghost" type="button" disabled>全部下载 (.zip)</button>
          <button id="cancel" class="btn" type="button" disabled>取消</button>
          <button id="start" class="btn btn-primary" type="button" disabled>开始转换</button>
        </div>
      </div>
    </footer>
  </div>

  <input id="file-input" type="file" accept=".png,.jpg,.jpeg,.jfif,.jpe,.webp,.bmp,.dib,.gif,.tif,.tiff,.ico,.avif,.tga,.ppm,.pgm,.pbm" multiple hidden>
  <input id="folder-input" type="file" webkitdirectory directory multiple hidden>

  <div id="preview" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="preview-title">
    <div class="modal-card">
      <header class="modal-head">
        <div class="modal-title">
          <h2 id="preview-title">预览</h2>
          <p id="preview-path" class="modal-path"></p>
        </div>
        <button id="preview-close" class="icon-button" type="button" aria-label="关闭预览">
          <svg width="18" height="18"><use href="#i-close"/></svg>
        </button>
      </header>
      <div class="modal-body">
        <div class="preview-canvas-wrap"><canvas id="preview-canvas" width="640" height="400"></canvas></div>
        <p id="preview-meta" class="preview-meta"></p>
        <div id="preview-sizes" class="preview-sizes"></div>
      </div>
      <footer class="modal-foot">
        <span id="preview-hint" class="hint"></span>
        <button id="preview-download" class="btn btn-primary" type="button" hidden>下载</button>
      </footer>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="js/util.js"></script>
  <script src="js/ico.js"></script>
  <script src="js/bmp.js"></script>
  <script src="js/tiff.js"></script>
  <script src="js/zip.js"></script>
  <script src="js/convert.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
